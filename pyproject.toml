[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mocod-converter"
version = "0.1.0"
description = "Локальная конвертация реестра займов МФО из XLSX в CSV для МоКоД"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["openpyxl>=3.1,<4"]

[project.urls]
Repository = "https://github.com/NuclearAPK/mocod-converter"
Issues = "https://github.com/NuclearAPK/mocod-converter/issues"

[project.scripts]
mocod-converter = "mocod_converter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
